<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sourcing Decision Room</title>
  <link rel="icon" type="image/svg+xml" href="/assets/mark.svg" />
  <link rel="apple-touch-icon" href="/assets/mark.svg" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/assets/experience.css" />
  <link rel="stylesheet" href="/assets/workspace.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brandmark"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><mask id="brandmask"><rect width="32" height="32" fill="#fff"/><circle cx="16" cy="16" r="2.7" fill="#000"/></mask></defs><g fill="currentColor" mask="url(#brandmask)"><ellipse cx="16" cy="8.1" rx="3.8" ry="7.5" transform="rotate(0 16 16)"/><ellipse cx="16" cy="8.1" rx="3.8" ry="7.5" transform="rotate(60 16 16)"/><ellipse cx="16" cy="8.1" rx="3.8" ry="7.5" transform="rotate(120 16 16)"/><ellipse cx="16" cy="8.1" rx="3.8" ry="7.5" transform="rotate(180 16 16)"/><ellipse cx="16" cy="8.1" rx="3.8" ry="7.5" transform="rotate(240 16 16)"/><ellipse cx="16" cy="8.1" rx="3.8" ry="7.5" transform="rotate(300 16 16)"/></g></svg></div><div><b>aerchain</b><span>Decision room</span></div></div>
      <nav id="nav">
        <button class="navitem active" data-view="rfx"><svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg><span class="navlabel">RFx Builder</span></button>
        <button class="navitem" data-view="responses"><svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.6 2.6h4.8L16 13h5"/><path d="M5.6 4.8h12.8L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/></svg><span class="navlabel">Responses</span></button>
        <button class="navitem" data-view="compare"><svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="7.4" height="16" rx="1.6"/><rect x="13.6" y="4" width="7.4" height="16" rx="1.6"/><path d="M5.4 9h3.6M16 9h3.6M5.4 13h2.4M16 13h2.4"/></svg><span class="navlabel">Review &amp; Compare</span></button>
        <button class="navitem" data-view="analysis"><svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.6a7.9 7.9 0 0 1-11.4 7.1L4 20.4l1.4-5A7.9 7.9 0 1 1 21 11.6z"/><path d="m12.4 8 .9 2.2 2.2.9-2.2.9-.9 2.2-.9-2.2-2.2-.9 2.2-.9z"/></svg><span class="navlabel">Analysis Room</span></button>
      </nav>
      <div class="sidefoot"><div class="pulse"></div><div><b id="aiStatus">Connecting…</b><span>Evidence behind every decision</span></div></div>
    </aside>
    <main>
      <header class="topbar">
        <div><div class="eyebrow">SOURCING EVENT · <span id="eventId">...</span></div><h1 id="eventTitle">Loading…</h1></div>
        <div class="header-actions"><button class="primary" data-view="analysis">Ask this event</button></div>
      </header>
      <section class="kpis" id="kpis"></section>
      <section id="view-rfx" class="view active"></section>
      <section id="view-responses" class="view"></section>
      <section id="view-compare" class="view"></section>
      <section id="view-analysis" class="view"></section>
    </main>
  </div>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer"><button class="drawer-close" id="drawerClose">×</button><div id="drawerBody"></div></aside>
  <script src="/assets/app.js"></script>
  <script src="/assets/experience.js"></script>
  <script src="/assets/workspace.js"></script>
</body>
</html>
